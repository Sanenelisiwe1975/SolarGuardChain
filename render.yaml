# Render blueprint for the API: New > Blueprint > pick this repo.
# The web app is served by Vercel (frontend/vercel.json), which forwards /api here.
# The free plan has no persistent disk: on each restart the API rebuilds its panels
# from the Fuji contract's events, so the registry survives. Profiles and alerts reset.
services:
  - type: web
    name: solarguard-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CHAIN_MODE
        value: fuji
      - key: REGISTRY_ADDRESS        # public contract address, safe to commit
        value: "0x1F9F13Ba36A6E65E319C4D02a7B7a4835DDF4187"
      - key: REGISTRY_FROM_BLOCK     # block the contract was deployed in
        value: "61393402"
      - key: RELAYER_PRIVATE_KEY     # secret: paste in the Render dashboard
        sync: false
      - key: OWNER_SALT              # secret: must be the SAME value as backend/.env, or owner IDs stop matching
        sync: false
      - key: GEMINI_API_KEY
        sync: false
